<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<style>@font-face{font-family:S;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:S;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:S,'Segoe UI',Helvetica,Arial,sans-serif}
.up{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes d1{to{transform:translate(-140px,70px) scale(1.15)}}
@keyframes d2{to{transform:translate(120px,-60px) scale(.9)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes sweep{0%{transform:translateX(-120px);opacity:0}50%{opacity:1}100%{transform:translateX(120px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F16B0D"/><stop offset=".55" stop-color="#E61416"/><stop offset="1" stop-color="#C2187A"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#F16B0D" stop-opacity=".55"/><stop offset="1" stop-color="#F16B0D" stop-opacity="0"/></radialGradient>
<radialGradient id="r"><stop offset="0" stop-color="#E61416" stop-opacity=".5"/><stop offset="1" stop-color="#E61416" stop-opacity="0"/></radialGradient>
<radialGradient id="v"><stop offset="0" stop-color="#7B2FF7" stop-opacity=".35"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
<clipPath id="clip"><rect width="1200" height="440" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)"><rect width="1200" height="440" fill="#070707"/>
<rect width="1200" height="440" fill="url(#dots)"/>
<circle cx="980" cy="60" r="420" fill="url(#o)" style="animation:d1 13s ease-in-out infinite alternate"/>
<circle cx="1150" cy="460" r="360" fill="url(#r)" style="animation:d2 17s ease-in-out infinite alternate"/>
<circle cx="640" cy="520" r="300" fill="url(#v)" style="animation:d1 19s ease-in-out infinite alternate"/>
<g class="up" style="animation-delay:.05s"><circle cx="78" cy="78" r="5" fill="url(#g)" style="animation:pulse 2s ease-in-out infinite"/>
<text x="94" y="84" font-size="14" font-weight="500" letter-spacing="2.4" fill="#f4f1ee" fill-opacity=".7">PERSONAL AI AGENT  ·  PYTHON  ·  GEMINI + CLAUDE</text></g>
<text class="up" style="animation-delay:.15s" x="68" y="196" font-size="124" font-weight="700" letter-spacing="-5" fill="url(#g)">Convoy</text>
<text class="up" style="animation-delay:.3s" x="72" y="256" font-size="27" font-weight="500" fill="#f4f1ee">Your AI chief of staff, in a glass sidebar on your desktop.</text>
<g class="up" style="animation-delay:0.55s"><rect x="72" y="300" width="139" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="142" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">Morning brief</text></g><g class="up" style="animation-delay:0.63s"><rect x="221.3" y="300" width="107" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="275" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">2 inboxes</text></g><g class="up" style="animation-delay:0.71s"><rect x="338.2" y="300" width="123" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="400" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">Voice notes</text></g><g class="up" style="animation-delay:0.79s"><rect x="471.29999999999995" y="300" width="131" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="537" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">Meeting prep</text></g><g class="up" style="animation-delay:0.87s"><rect x="612.5" y="300" width="99" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="662" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">Obsidian</text></g><g class="up" style="animation-delay:0.95s"><rect x="721.3" y="300" width="58" height="36" rx="18" fill="#fff" fill-opacity=".06" stroke="url(#g)" stroke-opacity=".7"/><text x="750" y="324" text-anchor="middle" font-size="15" font-weight="500" fill="#f4f1ee">MCP</text></g>
<g class="up" style="animation-delay:.4s">
  <rect x="850" y="90" width="282" height="300" rx="22" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
  <rect x="866" y="108" width="140" height="92" rx="22" fill="url(#g)"/><path d="M888 128 l26 26 -26 26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="animation:pulse 2.4s 0.0s ease-in-out infinite"/><path d="M920 128 l26 26 -26 26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="animation:pulse 2.4s 0.25s ease-in-out infinite"/><path d="M952 128 l26 26 -26 26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="animation:pulse 2.4s 0.5s ease-in-out infinite"/>
  <rect x="878" y="236" width="210" height="10" rx="5" fill="#fff" fill-opacity="0.50"/><rect x="878" y="262" width="170" height="10" rx="5" fill="#fff" fill-opacity="0.43"/><rect x="878" y="288" width="230" height="10" rx="5" fill="#fff" fill-opacity="0.36"/><rect x="878" y="314" width="140" height="10" rx="5" fill="#fff" fill-opacity="0.29"/><rect x="878" y="340" width="190" height="10" rx="5" fill="#fff" fill-opacity="0.22"/>
  <rect x="866" y="368" width="250" height="2" rx="1" fill="url(#shine)" style="animation:sweep 3.2s linear infinite"/>
</g></g>
<rect x=".5" y=".5" width="1199" height="439" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>